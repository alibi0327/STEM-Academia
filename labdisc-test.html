<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Labdisc — Итоговый тест</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
        }

        .back-btn {
            border: none;
            background: #eef4ff;
            color: #2563eb;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .main {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .top-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 22px;
        }

        .top-card h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .top-card p {
            color: #667085;
            line-height: 1.6;
        }

        .question-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 28px;
        }

        .question-number {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .question-title {
            font-size: 22px;
            margin-bottom: 22px;
        }

        .answers {
            display: grid;
            gap: 12px;
        }

        .answer {
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            background: #f8fafc;
        }

        .answer.selected {
            border-color: #2563eb;
            background: #eef4ff;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #eef2f6;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .result {
            display: none;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 32px;
            text-align: center;
        }

        .result h2 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .score {
            font-size: 50px;
            font-weight: 700;
            color: #2563eb;
            margin: 20px 0;
        }

        .status {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .passed {
            color: #16a34a;
        }

        .failed {
            color: #dc2626;
        }

        @media(max-width:600px){
            .header {
                padding: 0 15px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        STEM Trainer
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='labdisc.html'"
    >
        ← Вернуться к курсу
    </button>

</header>

<main class="main">

    <section class="top-card">

        <h1>
            Итоговый тест Labdisc
        </h1>

        <p>
            Ответьте на вопросы по пройденному материалу.
            Для успешного прохождения необходимо набрать не менее 80%.
        </p>

    </section>

    <section
        class="question-card"
        id="questionCard"
    ></section>

    <section
        class="result"
        id="resultBox"
    ></section>

</main>


<script>

const questions = [

    {
        question: "Для чего используется Labdisc?",
        answers: [
            "Для сбора и анализа экспериментальных данных",
            "Только для печати документов",
            "Только для просмотра видео",
            "Для создания презентаций"
        ],
        correct: 0
    },

    {
        question: "Какая программа используется для работы с данными Labdisc?",
        answers: [
            "GlobiLab X",
            "Paint",
            "PowerPoint",
            "Calculator"
        ],
        correct: 0
    },

    {
        question: "Какой способ подключения может использоваться с Labdisc?",
        answers: [
            "USB",
            "Только HDMI",
            "Только VGA",
            "Только Ethernet"
        ],
        correct: 0
    },

    {
        question: "Что измеряет датчик температуры?",
        answers: [
            "Температуру",
            "Освещённость",
            "Уровень звука",
            "Расстояние"
        ],
        correct: 0
    },

    {
        question: "Что нужно сделать перед началом эксперимента?",
        answers: [
            "Проверить устройство, заряд и необходимые датчики",
            "Сразу выключить Labdisc",
            "Удалить все данные",
            "Отключить все датчики"
        ],
        correct: 0
    },

    {
        question: "Для чего используется график после эксперимента?",
        answers: [
            "Для анализа изменения измеряемой величины",
            "Для украшения документа",
            "Для изменения пароля",
            "Для подключения USB"
        ],
        correct: 0
    },

    {
        question: "Что зависит от конкретной модели Labdisc?",
        answers: [
            "Набор доступных датчиков",
            "Название платформы STEM Trainer",
            "Цвет сайта",
            "Логин преподавателя"
        ],
        correct: 0
    },

    {
        question: "Какая модель Labdisc ориентирована на экологические исследования?",
        answers: [
            "Enviro",
            "Physio",
            "BioChem",
            "Arduino"
        ],
        correct: 0
    },

    {
        question: "Какая модель ориентирована на физические эксперименты?",
        answers: [
            "Physio",
            "Enviro",
            "BioChem",
            "Gensci Printer"
        ],
        correct: 0
    },

    {
        question: "Что является последним этапом исследовательской работы?",
        answers: [
            "Формулирование вывода",
            "Выбор цвета интерфейса",
            "Создание логина",
            "Удаление графика"
        ],
        correct: 0
    }

];


let currentQuestion = 0;

let selectedAnswers =
    new Array(
        questions.length
    ).fill(null);


function renderQuestion() {

    const card =
        document.getElementById(
            "questionCard"
        );

    const item =
        questions[
            currentQuestion
        ];


    let answersHtml = "";


    item.answers.forEach(
        (answer, index) => {

            const selected =
                selectedAnswers[
                    currentQuestion
                ] === index;


            answersHtml += `

                <div
                    class="
                        answer
                        ${selected ? "selected" : ""}
                    "
                    onclick="
                        selectAnswer(${index})
                    "
                >

                    ${answer}

                </div>

            `;

        }
    );


    card.innerHTML = `

        <div class="question-number">

            Вопрос
            ${currentQuestion + 1}
            из
            ${questions.length}

        </div>


        <div class="question-title">

            ${item.question}

        </div>


        <div class="answers">

            ${answersHtml}

        </div>


        <div class="actions">

            <button
                class="
                    btn
                    btn-secondary
                "
                onclick="
                    previousQuestion()
                "
                ${
                    currentQuestion === 0
                        ? "disabled"
                        : ""
                }
            >

                ← Назад

            </button>


            <button
                class="
                    btn
                    btn-primary
                "
                onclick="
                    nextQuestion()
                "
            >

                ${
                    currentQuestion ===
                    questions.length - 1
                        ? "Завершить тест"
                        : "Следующий вопрос →"
                }

            </button>

        </div>

    `;

}


function selectAnswer(index) {

    selectedAnswers[
        currentQuestion
    ] = index;


    renderQuestion();

}


function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        renderQuestion();

    }

}


function nextQuestion() {

    if (
        selectedAnswers[
            currentQuestion
        ] === null
    ) {

        alert(
            "Выберите один вариант ответа."
        );

        return;

    }


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        renderQuestion();

        return;

    }


    finishTest();

}


function finishTest() {

    let correctCount = 0;


    questions.forEach(
        (question, index) => {

            if (
                selectedAnswers[index] ===
                question.correct
            ) {

                correctCount++;

            }

        }
    );


    const percent =
        Math.round(
            correctCount /
            questions.length *
            100
        );


    const passed =
        percent >= 80;


    saveResult(
        correctCount,
        percent,
        passed
    );


    showResult(
        correctCount,
        percent,
        passed
    );

}


function saveResult(
    correctCount,
    percent,
    passed
) {

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "stemCurrentUser"
            )
        );


    const teachers =
        JSON.parse(
            localStorage.getItem(
                "stemTeachers"
            )
        ) || [];


    const teacherIndex =
        teachers.findIndex(
            teacher =>
                teacher.id ===
                currentUser.id
        );


    if (
        teacherIndex === -1
    ) {

        return;

    }


    if (
        !teachers[
            teacherIndex
        ].testResults
    ) {

        teachers[
            teacherIndex
        ].testResults = {};

    }


    const oldResult =
        teachers[
            teacherIndex
        ].testResults["Labdisc"];


    let attempts = 1;


    if (
        oldResult &&
        oldResult.attempts
    ) {

        attempts =
            oldResult.attempts + 1;

    }


    teachers[
        teacherIndex
    ].testResults["Labdisc"] = {

        correct:
            correctCount,

        total:
            questions.length,

        percent:
            percent,

        passed:
            passed,

        attempts:
            attempts,

        date:
            new Date()
                .toLocaleString(
                    "ru-RU"
                )

    };


    localStorage.setItem(
        "stemTeachers",
        JSON.stringify(teachers)
    );

}


function showResult(
    correctCount,
    percent,
    passed
) {

    document.getElementById(
        "questionCard"
    ).style.display =
        "none";


    const resultBox =
        document.getElementById(
            "resultBox"
        );


    resultBox.style.display =
        "block";


    resultBox.innerHTML = `

        <h2>
            Итоговый результат
        </h2>


        <div class="score">

            ${percent}%

        </div>


        <div>

            Правильных ответов:
            <strong>
                ${correctCount}
                из
                ${questions.length}
            </strong>

        </div>


        <div
            class="
                status
                ${
                    passed
                        ? "passed"
                        : "failed"
                }
            "
            style="
                margin-top:20px;
            "
        >

            ${
                passed
                    ? "✓ Тест успешно пройден"
                    : "Тест пока не пройден"
            }

        </div>


        <button
            class="
                btn
                btn-primary
            "
            onclick="
                window.location.href='teacher.html'
            "
        >

            Вернуться в кабинет

        </button>


        ${
            !passed
                ? `

                    <button
                        class="
                            btn
                            btn-secondary
                        "
                        style="
                            margin-left:8px;
                        "
                        onclick="
                            location.reload()
                        "
                    >

                        Пройти повторно

                    </button>

                `
                : ""
        }

    `;

}


renderQuestion();

</script>

</body>
</html>
