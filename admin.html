<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEM Academia — Администратор</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="topbar">
  <div class="brand">STEM <span>ACADEMIA</span></div>
  <div class="topbar-actions">
    <span id="adminName">Администратор</span>
    <button id="logoutBtn" class="secondary">Выйти</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="nav active" data-view="dashboard">Главная</button>
    <button class="nav" data-view="schools">Школы</button>
    <button class="nav" data-view="teachers">Учителя</button>
    <button class="nav" data-view="courses">Курсы</button>
    <button class="nav" data-view="results">Результаты</button>
    <button class="nav" data-view="certificates">Сертификаты</button>
  </aside>

  <main class="content">
    <section id="dashboard" class="view active">
      <h1>Панель администратора</h1>
      <div class="cards">
        <div class="card"><strong id="schoolCount">—</strong><span>Школ</span></div>
        <div class="card"><strong id="teacherCount">—</strong><span>Учителей</span></div>
        <div class="card"><strong id="courseCount">—</strong><span>Курсов</span></div>
        <div class="card"><strong id="certificateCount">—</strong><span>Сертификатов</span></div>
      </div>
    </section>

    <section id="schools" class="view">
      <div class="section-head">
        <h1>Школы</h1>
        <button id="showSchoolForm">+ Добавить школу</button>
      </div>

      <form id="schoolForm" class="panel form hidden">
        <label>Название школы<input id="schoolName" required></label>
        <label>Город<input id="schoolCity"></label>
        <label>Адрес<input id="schoolAddress"></label>
        <div class="row">
          <button type="submit">Сохранить</button>
          <button type="button" id="cancelSchool" class="secondary">Отмена</button>
        </div>
      </form>

      <div id="schoolsList" class="table-wrap"></div>
    </section>

    <section id="teachers" class="view">
      <h1>Учителя</h1>
      <div class="notice">Создание учеток учителей подключим следующим шагом через Supabase Edge Function.</div>
      <div id="teachersList" class="table-wrap"></div>
    </section>

    <section id="courses" class="view">
      <h1>Курсы</h1>
      <div id="coursesList" class="table-wrap"></div>
    </section>

    <section id="results" class="view">
      <h1>Результаты</h1>
      <div id="resultsList" class="table-wrap"></div>
    </section>

    <section id="certificates" class="view">
      <h1>Сертификаты</h1>
      <div id="certificatesList" class="table-wrap"></div>
    </section>
  </main>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
