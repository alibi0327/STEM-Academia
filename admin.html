<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STEM Trainer — Администратор</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.layout{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#111827;
    color:white;
    padding:24px 18px;
}

.brand{
    font-size:22px;
    font-weight:700;
    margin-bottom:35px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    border:0;
    background:transparent;
    color:#d1d5db;
    text-align:left;
    padding:13px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#1f2937;
    color:white;
}

.main{
    flex:1;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.topbar h1{
    font-size:30px;
}

.subtitle{
    color:#667085;
    margin-top:6px;
}

.logout{
    background:#ef4444;
    color:white;
    border:0;
    border-radius:9px;
    padding:10px 16px;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:28px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:20px;
}

.card-title{
    color:#667085;
    font-size:14px;
    margin-bottom:8px;
}

.card-value{
    font-size:30px;
    font-weight:700;
}

.section{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
    margin-bottom:24px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-header h2{
    font-size:21px;
}

.primary-btn{
    border:0;
    background:#2563eb;
    color:white;
    padding:11px 16px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:13px 10px;
    text-align:left;
    border-bottom:1px solid #eef0f3;
    font-size:14px;
    vertical-align:middle;
}

th{
    color:#667085;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e8f0ff;
    color:#2563eb;
    font-size:12px;
    margin:2px;
}

.status-pass{
    display:inline-block;
    background:#dcfce7;
    color:#166534;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.status-fail{
    display:inline-block;
    background:#fee2e2;
    color:#991b1b;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.status-empty{
    color:#98a2b3;
}

.progress{
    width:130px;
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress span{
    display:block;
    height:100%;
    background:#22c55e;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.empty{
    color:#98a2b3;
    padding:15px 0;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:18px;
    padding:24px;
}

.modal-box h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:46px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    padding:0 12px;
}

.course-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.course-item{
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:10px;
    font-size:14px;
}

.course-item input{
    width:auto;
    height:auto;
    margin-right:6px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.secondary-btn{
    border:1px solid #d0d5dd;
    background:white;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
}

.delete-btn{
    border:0;
    background:#fee2e2;
    color:#b91c1c;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
}

@media(max-width:1000px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:760px){
    .layout{
        display:block;
    }

    .sidebar{
        width:100%;
    }

    .main{
        padding:18px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .section{
        overflow-x:auto;
    }

    table{
        min-width:850px;
    }
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">
STEM Trainer
</div>

<div class="menu">

<button
class="active"
id="menuDashboard"
onclick="showView('dashboard')">
Главная
</button>

<button
id="menuTeachers"
onclick="showView('teachers')">
Учителя
</button>

<button
id="menuResults"
onclick="showView('results')">
Результаты
</button>

</div>

</aside>


<main class="main">

<div class="topbar">

<div>
<h1 id="pageTitle">
Панель администратора
</h1>

<div class="subtitle">
Управление обучением преподавателей
</div>
</div>

<button
class="logout"
onclick="logout()">
Выйти
</button>

</div>


<!-- ГЛАВНАЯ -->

<div
class="view active"
id="dashboardView">

<div class="cards">

<div class="card">
<div class="card-title">
Учителей
</div>
<div
class="card-value"
id="teachersCount">
0
</div>
</div>

<div class="card">
<div class="card-title">
Курсов
</div>
<div class="card-value">
5
</div>
</div>

<div class="card">
<div class="card-title">
Обучаются
</div>
<div
class="card-value"
id="activeCount">
0
</div>
</div>

<div class="card">
<div class="card-title">
Сдали Labdisc
</div>
<div
class="card-value"
id="passedCount">
0
</div>
</div>

</div>


<section class="section">

<div class="section-header">

<h2>
Последние результаты Labdisc
</h2>

</div>

<div id="dashboardResults"></div>

</section>

</div>


<!-- УЧИТЕЛЯ -->

<div
class="view"
id="teachersView">

<section class="section">

<div class="section-header">

<h2>
Учителя
</h2>

<button
class="primary-btn"
onclick="openModal()">
+ Добавить учителя
</button>

</div>

<div id="teachersTable"></div>

</section>

</div>


<!-- РЕЗУЛЬТАТЫ -->

<div
class="view"
id="resultsView">

<section class="section">

<div class="section-header">

<div>
<h2>
Результаты обучения
</h2>

<div
style="
color:#667085;
font-size:14px;
margin-top:5px;
">
Labdisc
</div>

</div>

</div>

<div id="resultsTable"></div>

</section>

</div>

</main>

</div>


<!-- MODAL -->

<div
class="modal"
id="teacherModal">

<div class="modal-box">

<h2>
Новый учитель
</h2>

<div class="form-group">

<label>
ФИО
</label>

<input
id="fullName"
type="text"
placeholder="Айжан Сериковна">

</div>


<div class="form-group">

<label>
Логин
</label>

<input
id="teacherLogin"
type="text"
placeholder="a.serikova">

</div>


<div class="form-group">

<label>
Пароль
</label>

<input
id="teacherPassword"
type="text"
placeholder="Введите пароль">

</div>


<div class="form-group">

<label>
Назначить курсы
</label>

<div class="course-list">

<label class="course-item">
<input
type="checkbox"
value="Arduino"
class="courseCheck">
Arduino
</label>

<label class="course-item">
<input
type="checkbox"
value="Roket"
class="courseCheck">
Roket
</label>

<label class="course-item">
<input
type="checkbox"
value="Labdisc"
class="courseCheck">
Labdisc
</label>

<label class="course-item">
<input
type="checkbox"
value="3D-принтер"
class="courseCheck">
3D-принтер
</label>

<label class="course-item">
<input
type="checkbox"
value="Лазерный принтер"
class="courseCheck">
Лазерный принтер
</label>

</div>

</div>


<div class="modal-actions">

<button
class="secondary-btn"
onclick="closeModal()">
Отмена
</button>

<button
class="primary-btn"
onclick="createTeacher()">
Создать учителя
</button>

</div>

</div>

</div>


<script>

/* ============================
   AUTH
============================ */

const currentUser =
JSON.parse(
localStorage.getItem("stemCurrentUser")
);

if(
!currentUser ||
currentUser.role !== "admin"
){
window.location.href = "index.html";
}


/* ============================
   TEACHERS
============================ */

let teachers =
JSON.parse(
localStorage.getItem("stemTeachers")
) || [];


function saveTeachers(){

localStorage.setItem(
"stemTeachers",
JSON.stringify(teachers)
);

}


/* ============================
   VIEWS
============================ */

function showView(view){

document
.querySelectorAll(".view")
.forEach(item =>
item.classList.remove("active")
);

document
.querySelectorAll(".menu button")
.forEach(item =>
item.classList.remove("active")
);


if(view === "dashboard"){

document
.getElementById("dashboardView")
.classList.add("active");

document
.getElementById("menuDashboard")
.classList.add("active");

document
.getElementById("pageTitle")
.textContent =
"Панель администратора";

}


if(view === "teachers"){

document
.getElementById("teachersView")
.classList.add("active");

document
.getElementById("menuTeachers")
.classList.add("active");

document
.getElementById("pageTitle")
.textContent =
"Учителя";

}


if(view === "results"){

document
.getElementById("resultsView")
.classList.add("active");

document
.getElementById("menuResults")
.classList.add("active");

document
.getElementById("pageTitle")
.textContent =
"Результаты обучения";

}

}


/* ============================
   DASHBOARD
============================ */

function renderDashboard(){

document
.getElementById("teachersCount")
.textContent =
teachers.length;


const active =
teachers.filter(
teacher =>
getLabdiscProgress(teacher) > 0 &&
getLabdiscProgress(teacher) < 100
).length;


document
.getElementById("activeCount")
.textContent =
active;


const passed =
teachers.filter(
teacher =>
teacher.testResults &&
teacher.testResults.Labdisc &&
teacher.testResults.Labdisc.passed
).length;


document
.getElementById("passedCount")
.textContent =
passed;


renderDashboardResults();

}


/* ============================
   LABDISC PROGRESS
============================ */

function getLabdiscProgress(teacher){

if(
teacher.courseProgress &&
typeof teacher.courseProgress.Labdisc === "number"
){

return teacher.courseProgress.Labdisc;

}

return 0;

}


/* ============================
   DASHBOARD RESULTS
============================ */

function renderDashboardResults(){

const container =
document.getElementById(
"dashboardResults"
);


const withResults =
teachers.filter(
teacher =>
teacher.testResults &&
teacher.testResults.Labdisc
);


if(withResults.length === 0){

container.innerHTML =
'<div class="empty">Результатов тестирования пока нет.</div>';

return;

}


let html = `

<table>

<thead>

<tr>
<th>Учитель</th>
<th>Результат</th>
<th>Статус</th>
<th>Дата</th>
</tr>

</thead>

<tbody>

`;


withResults
.slice()
.reverse()
.slice(0,5)
.forEach(teacher => {

const result =
teacher.testResults.Labdisc;


html += `

<tr>

<td>
${teacher.fullName}
</td>

<td>
<strong>
${result.percent}%
</strong>
</td>

<td>
${result.passed
?
'<span class="status-pass">Сдан</span>'
:
'<span class="status-fail">Не сдан</span>'
}
</td>

<td>
${result.date || "—"}
</td>

</tr>

`;

});


html += `

</tbody>

</table>

`;


container.innerHTML = html;

}


/* ============================
   TEACHERS TABLE
============================ */

function renderTeachers(){

const container =
document.getElementById(
"teachersTable"
);


if(teachers.length === 0){

container.innerHTML =
'<div class="empty">Учителя пока не добавлены.</div>';

return;

}


let html = `

<table>

<thead>

<tr>

<th>
ФИО
</th>

<th>
Логин
</th>

<th>
Курсы
</th>

<th>
Labdisc
</th>

<th>
</th>

</tr>

</thead>

<tbody>

`;


teachers.forEach(
(teacher,index)=>{


const courses =
(teacher.courses || [])
.map(course =>
`<span class="badge">${course}</span>`
)
.join("");


const progress =
getLabdiscProgress(
teacher
);


html += `

<tr>

<td>
${teacher.fullName}
</td>

<td>
${teacher.login}
</td>

<td>
${courses || "Не назначены"}
</td>

<td>

<div
style="
display:flex;
align-items:center;
gap:10px;
">

<div class="progress">

<span
style="
width:${progress}%
">
</span>

</div>

${progress}%

</div>

</td>

<td>

<button
class="delete-btn"
onclick="
deleteTeacher(${index})
">
Удалить
</button>

</td>

</tr>

`;

});


html += `

</tbody>

</table>

`;


container.innerHTML = html;

}


/* ============================
   RESULTS TABLE
============================ */

function renderResults(){

const container =
document.getElementById(
"resultsTable"
);


if(teachers.length === 0){

container.innerHTML =
'<div class="empty">Учителя пока не добавлены.</div>';

return;

}


let html = `

<table>

<thead>

<tr>

<th>
ФИО
</th>

<th>
Прогресс
</th>

<th>
Тест
</th>

<th>
Правильных
</th>

<th>
Попытки
</th>

<th>
Статус
</th>

<th>
Дата
</th>

</tr>

</thead>

<tbody>

`;


teachers.forEach(teacher => {


const progress =
getLabdiscProgress(
teacher
);


const result =
teacher.testResults &&
teacher.testResults.Labdisc
?
teacher.testResults.Labdisc
:
null;


html += `

<tr>

<td>
<strong>
${teacher.fullName}
</strong>
</td>

<td>

<div
style="
display:flex;
align-items:center;
gap:10px;
">

<div class="progress">

<span
style="
width:${progress}%
">
</span>

</div>

${progress}%

</div>

</td>


<td>

${result
?
`<strong>${result.percent}%</strong>`
:
'<span class="status-empty">—</span>'
}

</td>


<td>

${result
?
`${result.correct} / ${result.total}`
:
'<span class="status-empty">—</span>'
}

</td>


<td>

${result
?
result.attempts
:
'<span class="status-empty">—</span>'
}

</td>


<td>

${result
?
(
result.passed
?
'<span class="status-pass">Сдан</span>'
:
'<span class="status-fail">Не сдан</span>'
)
:
'<span class="status-empty">Не проходил</span>'
}

</td>


<td>

${result
?
result.date
:
'<span class="status-empty">—</span>'
}

</td>

</tr>

`;

});


html += `

</tbody>

</table>

`;


container.innerHTML = html;

}


/* ============================
   MODAL
============================ */

function openModal(){

document
.getElementById(
"teacherModal"
)
.classList.add("open");

}


function closeModal(){

document
.getElementById(
"teacherModal"
)
.classList.remove("open");

clearForm();

}


function clearForm(){

document
.getElementById("fullName")
.value = "";

document
.getElementById("teacherLogin")
.value = "";

document
.getElementById("teacherPassword")
.value = "";


document
.querySelectorAll(
".courseCheck"
)
.forEach(
item =>
item.checked = false
);

}


/* ============================
   CREATE TEACHER
============================ */

function createTeacher(){

const fullName =
document
.getElementById("fullName")
.value
.trim();


const login =
document
.getElementById("teacherLogin")
.value
.trim();


const password =
document
.getElementById("teacherPassword")
.value
.trim();


const courses =
Array.from(
document.querySelectorAll(
".courseCheck:checked"
)
)
.map(item =>
item.value
);


if(
!fullName ||
!login ||
!password
){

alert(
"Заполните ФИО, логин и пароль."
);

return;

}


const exists =
teachers.some(
teacher =>
teacher.login === login
);


if(exists){

alert(
"Такой логин уже существует."
);

return;

}


teachers.push({

id:
Date.now(),

fullName:
fullName,

login:
login,

password:
password,

courses:
courses,

progress:
0,

courseProgress:{},

testResults:{}

});


saveTeachers();

renderAll();

closeModal();

}


/* ============================
   DELETE
============================ */

function deleteTeacher(index){

const teacher =
teachers[index];


if(
!confirm(
"Удалить учителя " +
teacher.fullName +
"?"
)
){

return;

}


teachers.splice(
index,
1
);


saveTeachers();

renderAll();

}


/* ============================
   LOGOUT
============================ */

function logout(){

localStorage.removeItem(
"stemCurrentUser"
);

window.location.href =
"index.html";

}


/* ============================
   ALL
============================ */

function renderAll(){

renderDashboard();

renderTeachers();

renderResults();

}


renderAll();

</script>

</body>
</html>
