<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Labdisc — STEM Trainer</title>

    <link rel="stylesheet" href="css/labdisc.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <div class="logo-box">S</div>
        STEM Trainer
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='teacher.html'"
    >
        ← Мои курсы
    </button>

</header>


<div class="layout">

    <aside class="sidebar">

        <div class="course-small">
            Учебный курс
        </div>

        <div class="course-title">
            🔬 Labdisc
        </div>


        <div class="progress-head">

            <span>
                Прогресс курса
            </span>

            <strong id="progressNumber">
                0%
            </strong>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <div id="lessonMenu"></div>

    </aside>


    <main class="main">

        <div
            class="content"
            id="content"
        ></div>

    </main>

</div>


<script src="js/labdisc.js"></script>

</body>
</html>
