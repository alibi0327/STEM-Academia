<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Labdisc — STEM Trainer</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    height:72px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:700;
}

.logo-box{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back{
    border:0;
    background:#eef4ff;
    color:#2563eb;
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

.layout{
    display:grid;
    grid-template-columns:320px 1fr;
    min-height:calc(100vh - 72px);
}

.sidebar{
    background:white;
    border-right:1px solid #e5e7eb;
    padding:25px 18px;
}

.course-small{
    color:#667085;
    font-size:12px;
}

.course-title{
    font-size:22px;
    margin:5px 0 20px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:7px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
    width:0;
    transition:.3s;
}

.module-name{
    font-size:11px;
    text-transform:uppercase;
    color:#98a2b3;
    font-weight:700;
    margin:20px 10px 7px;
}

.lesson{
    padding:12px;
    margin-bottom:5px;
    border-radius:9px;
    font-size:14px;
    cursor:pointer;
    line-height:1.35;
}

.lesson:hover{
    background:#f8fafc;
}

.lesson.active{
    background:#eef4ff;
    color:#1d4ed8;
    font-weight:600;
}

.lesson.done{
    border-left:3px solid #22c55e;
}

.main{
    padding:40px;
}

.content{
    max-width:950px;
    margin:auto;
}

.module-badge{
    display:inline-block;
    background:#eef4ff;
    color:#2563eb;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:15px;
}

h1{
    font-size:38px;
    margin-bottom:12px;
}

.subtitle{
    color:#667085;
    font-size:17px;
    line-height:1.6;
    margin-bottom:28px;
}

/* ВИЗУАЛЬНЫЙ БЛОК */

.visual{
    min-height:280px;
    border-radius:20px;
    background:linear-gradient(135deg,#eaf2ff,#f8fbff);
    border:1px solid #dbe7ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:25px;
    overflow:hidden;
}

.visual-content{
    text-align:center;
    padding:35px;
}

.visual-icon{
    font-size:75px;
    margin-bottom:15px;
}

.visual-title{
    font-size:25px;
    font-weight:700;
}

.visual-text{
    color:#667085;
    margin-top:8px;
}

/* НАСТОЯЩАЯ КАРТИНКА НА БУДУЩЕЕ */

.lesson-image{
    width:100%;
    max-height:470px;
    object-fit:contain;
    background:white;
    border-radius:18px;
    border:1px solid #e5e7eb;
    margin-bottom:25px;
}

/* КОНТЕНТ */

.block{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:26px;
    margin-bottom:20px;
}

.block h2{
    font-size:22px;
    margin-bottom:14px;
}

.block h3{
    margin:20px 0 10px;
}

.block p{
    color:#475467;
    line-height:1.75;
    margin-bottom:12px;
}

.block ul,
.block ol{
    padding-left:22px;
    color:#475467;
    line-height:1.9;
}

.info{
    background:#eff8ff;
    border-left:4px solid #2563eb;
}

.success{
    background:#ecfdf3;
    border-left:4px solid #16a34a;
}

.warning{
    background:#fffaeb;
    border-left:4px solid #f59e0b;
}

/* МОДЕЛИ */

.models{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.model{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    background:#fafcff;
}

.model-icon{
    font-size:38px;
    margin-bottom:10px;
}

.model h3{
    margin:0 0 8px;
}

.model p{
    font-size:14px;
    margin:0;
}

/* ШАГИ */

.steps{
    display:grid;
    gap:12px;
}

.step{
    display:flex;
    gap:15px;
    padding:15px;
    background:#f8fafc;
    border-radius:12px;
}

.step-number{
    min-width:35px;
    height:35px;
    background:#2563eb;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.step-text strong{
    display:block;
    margin-bottom:4px;
}

.step-text span{
    color:#667085;
    font-size:14px;
}

/* ССЫЛКИ */

.resources{
    display:grid;
    gap:10px;
}

.resource{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    border-radius:10px;
    border:1px solid #e5e7eb;
    background:#f8fafc;
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.resource:hover{
    background:#eef4ff;
}

/* КНОПКИ */

.actions{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:30px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:14px 20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.btn-back{
    background:#eef2f6;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-done{
    background:#16a34a;
    color:white;
}

.test-button{
    display:inline-block;
    margin-top:15px;
    background:#16a34a;
    color:white;
    padding:14px 20px;
    border:0;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        border-right:0;
        border-bottom:1px solid #e5e7eb;
    }

    .main{
        padding:25px 15px;
    }

    .models{
        grid-template-columns:1fr;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

/* =====================================================
   СОХРАНЁННЫЙ ПРОГРЕСС
===================================================== */

let completed =
    JSON.parse(
        localStorage.getItem("labdiscCompleted")
    ) || [];

let currentLesson = 0;


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

function saveProgress(){

    localStorage.setItem(
        "labdiscCompleted",
        JSON.stringify(completed)
    );

    syncTeacherProgress();
}


/* =====================================================
   СИНХРОНИЗАЦИЯ С КАБИНЕТОМ УЧИТЕЛЯ
===================================================== */

function syncTeacherProgress(){

    const currentUser =
        JSON.parse(
            localStorage.getItem("stemCurrentUser")
        );

    if(!currentUser){
        return;
    }

    const teachers =
        JSON.parse(
            localStorage.getItem("stemTeachers")
        ) || [];

    const index =
        teachers.findIndex(
            teacher =>
                teacher.id === currentUser.id
        );

    if(index === -1){
        return;
    }

    const percent =
        Math.round(
            completed.length /
            lessons.length *
            100
        );

    if(!teachers[index].courseProgress){
        teachers[index].courseProgress = {};
    }

    teachers[index].courseProgress["Labdisc"] =
        percent;

    localStorage.setItem(
        "stemTeachers",
        JSON.stringify(teachers)
    );
}


/* =====================================================
   МЕНЮ
===================================================== */

function renderMenu(){

    const menu =
        document.getElementById("lessonMenu");

    let html = "";
    let lastModule = "";

    lessons.forEach(
        (lesson,index)=>{

            if(lesson.module !== lastModule){

                html += `
                    <div class="module-name">
                        ${lesson.module}
                    </div>
                `;

                lastModule =
                    lesson.module;
            }

            const done =
                completed.includes(index);

            html += `

                <div
                    class="
                        lesson
                        ${index === currentLesson ? "active" : ""}
                        ${done ? "done" : ""}
                    "
                    onclick="openLesson(${index})"
                >

                    ${done ? "✓ " : ""}
                    ${lesson.title}

                </div>
            `;
        }
    );

    menu.innerHTML = html;
}


/* =====================================================
   УРОК
===================================================== */

function renderLesson(){

    const lesson =
        lessons[currentLesson];

    const done =
        completed.includes(
            currentLesson
        );

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="module-badge">
            ${lesson.module}
        </div>

        <h1>
            ${lesson.title}
        </h1>

        <div class="subtitle">
            ${lesson.subtitle}
        </div>

        ${lesson.html}

        <div class="actions">

            <button
                class="btn btn-back"
                onclick="previousLesson()"
                ${currentLesson === 0 ? "disabled" : ""}
            >
                ← Предыдущий урок
            </button>

            <button
                class="
                    btn
                    ${done ? "btn-done" : "btn-primary"}
                "
                onclick="completeLesson()"
            >

                ${
                    done
                    ? "✓ Урок пройден"
                    : "Завершить урок →"
                }

            </button>

        </div>
    `;

    renderFinalTestButton();
}


/* =====================================================
   ЗАВЕРШИТЬ УРОК
===================================================== */

function completeLesson(){

    if(
        !completed.includes(
            currentLesson
        )
    ){

        completed.push(
            currentLesson
        );

        completed.sort(
            (a,b)=>a-b
        );

        saveProgress();
    }

    updateProgress();
    renderMenu();

    if(
        currentLesson <
        lessons.length - 1
    ){

        currentLesson++;

        renderMenu();
        renderLesson();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        renderLesson();

    }
}


/* =====================================================
   ОТКРЫТЬ УРОК
===================================================== */

function openLesson(index){

    currentLesson = index;

    renderMenu();
    renderLesson();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   ПРЕДЫДУЩИЙ
===================================================== */

function previousLesson(){

    if(currentLesson > 0){

        currentLesson--;

        renderMenu();
        renderLesson();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}


/* =====================================================
   ПРОГРЕСС
===================================================== */

function updateProgress(){

    const percent =
        Math.round(
            completed.length /
            lessons.length *
            100
        );

    document.getElementById(
        "progressNumber"
    ).textContent =
        percent + "%";

    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

    syncTeacherProgress();
}


/* =====================================================
   ИТОГОВЫЙ ТЕСТ
===================================================== */

function renderFinalTestButton(){

    const box =
        document.getElementById(
            "finalTestBox"
        );

    if(!box){
        return;
    }

    if(
        completed.length ===
        lessons.length
    ){

        box.innerHTML = `

            <div class="block success">

                <h2>
                    🎓 Все уроки завершены
                </h2>

                <p>
                    Вы изучили все материалы курса.
                    Теперь необходимо пройти
                    итоговую аттестацию.
                </p>

                <button
                    class="test-button"
                    onclick="startTest()"
                >
                    Начать итоговый тест →
                </button>

            </div>
        `;

    }else{

        box.innerHTML = `

            <div class="block warning">

                <h2>
                    Итоговый тест
                </h2>

                <p>
                    Для открытия итогового теста
                    сначала завершите все уроки курса.
                </p>

            </div>
        `;
    }
}


/* =====================================================
   ПЕРЕХОД К ТЕСТУ
===================================================== */

function startTest(){

    localStorage.setItem(
        "stemTestCourse",
        "Labdisc"
    );

    window.location.href =
        "labdisc-test.html";
}


/* =====================================================
   ЗАПУСК
===================================================== */

renderMenu();
renderLesson();
updateProgress();

</script>
