description:"Знакомство с цифровой лабораторией Labdisc и её возможностями.",
html:`

<div class="hero">

<div class="hero-inner">

<div class="block">

<h2>Что такое Labdisc?</h2>

<p>
Labdisc — это компактная цифровая лаборатория,
которая используется для проведения учебных
естественно-научных экспериментов.
</p>

<p>
Устройство объединяет датчики, систему регистрации
данных и возможность передачи результатов на
компьютер или планшет.
</p>

<p>
Учитель может использовать Labdisc для демонстрации
экспериментов, а ученики — для самостоятельного
сбора и анализа экспериментальных данных.
</p>

</div>


<div class="block">

<h2>Что позволяет делать Labdisc?</h2>

<ul>

<li>получать данные с различных датчиков;</li>

<li>наблюдать изменения физических величин;</li>

<li>проводить измерения в реальном времени;</li>

<li>сохранять результаты экспериментов;</li>

<li>строить графики;</li>

<li>сравнивать результаты измерений;</li>

<li>проводить лабораторные и полевые исследования.</li>

</ul>

</div>


<div class="block tip">

<h2>Цель этого курса</h2>

<p>

уметь подготовить устройство к работе,
подключить его к программному обеспечению,
выбрать необходимые датчики и провести
учебный эксперимент.
</p>

</div>


<div class="block">

class="resource"

`

html:`

<div class="block">

Перед проведением экспериментов преподавателю

},

{

html:`

<div class="block">

<h2>Работа с результатами</h2>

<p>

</p>

<ul>

</ul>

</div>

`
},

{
module:"Модуль 7",
title:"Labdisc на уроке",
description:"Организация STEM-занятия.",
html:`

<div class="block">

<h2>Использование на уроке</h2>

<p>
Labdisc позволяет организовать обучение,
при котором ученики не только изучают

</p>

<p>
Преподаватель может разделить класс

</p>

</div>

`
},

{
module:"Модуль 8",
title:"Итоговая аттестация",
description:"Проверка знаний преподавателя.",
html:`

<div class="block">

<h2>Курс завершён</h2>

<p>
После изучения всех предыдущих материалов

</p>

<button
class="btn btn-primary"

Пройти итоговый тест
</button>

</div>

`
}

];


/* ==================================
   ПРОГРЕСС
================================== */

let completed =
JSON.parse(
localStorage.getItem("labdiscCompleted")
) || [];


let currentLesson = 0;



function save(){

localStorage.setItem(
"labdiscCompleted",
JSON.stringify(completed)
);

}


/* ==================================
   МЕНЮ
================================== */

function renderMenu(){

const menu =
document.getElementById("lessonMenu");

let html = "";

let lastModule = "";


lessons.forEach((lesson,index)=>{

if(lesson.module !== lastModule){

html += `
<div class="module-title">
${lesson.module}
</div>
`;

lastModule = lesson.module;

}


html += `

<div
class="
lesson
${index === currentLesson ? "active" : ""}
${completed.includes(index) ? "done" : ""}
"
onclick="openLesson(${index})">

${completed.includes(index) ? "✓ " : ""}
${lesson.title}

</div>

`;

});


menu.innerHTML = html;

}


/* ==================================
   УРОК
================================== */

function renderLesson(){

const lesson =
lessons[currentLesson];

const done =
completed.includes(currentLesson);


document.getElementById("content").innerHTML = `

<div class="label">
${lesson.module}
</div>

<h1>
${lesson.title}
</h1>

<div class="description">
${lesson.description}
</div>

${lesson.html}


<div class="actions">

<button
class="btn btn-secondary"
onclick="previousLesson()"
${currentLesson === 0 ? "disabled" : ""}>
← Назад
</button>


<button
class="btn ${done ? "btn-done" : "btn-primary"}"
onclick="completeLesson()">

${done ? "✓ Урок пройден" : "Завершить урок →"}

</button>

</div>

`;

}


/* ==================================
   ЗАВЕРШЕНИЕ
================================== */

function completeLesson(){

if(!completed.includes(currentLesson)){

completed.push(currentLesson);

save();

}

updateProgress();

renderMenu();


if(currentLesson < lessons.length - 1){

currentLesson++;

renderMenu();

renderLesson();

}else{

renderLesson();

}

}


/* ==================================
   НАВИГАЦИЯ
================================== */

function openLesson(index){

currentLesson = index;

renderMenu();

renderLesson();

}


function previousLesson(){

if(currentLesson > 0){

currentLesson--;

renderMenu();

renderLesson();

}

}


/* ==================================
   ПРОГРЕСС
================================== */

function updateProgress(){

const percent =
Math.round(
completed.length /
lessons.length *
100
);


document.getElementById(
"progressNumber"
).textContent =
percent + "%";


document.getElementById(
"progressBar"
).style.width =
percent + "%";

}


/* ==================================
   ТЕСТ
================================== */

function startTest(){

localStorage.setItem(
"stemTestCourse",
"Labdisc"
);

location.href =
"test.html";

}


renderMenu();

renderLesson();

updateProgress();

</script>
