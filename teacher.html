<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STEM Trainer — Кабинет учителя</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* =========================
           ШАПКА
        ========================= */

        .header {
            height: 74px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* =========================
           ОСНОВНАЯ ОБЛАСТЬ
        ========================= */

        .main {
            max-width: 1150px;
            margin: 0 auto;
            padding: 36px 20px;
        }

        .welcome {
            background: white;
            padding: 28px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            margin-bottom: 30px;
        }

        .welcome-small {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #667085;
            line-height: 1.6;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 24px;
        }

        .course-count {
            color: #667085;
            font-size: 14px;
        }

        /* =========================
           КУРСЫ
        ========================= */

        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .course-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            transition: 0.2s;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
        }

        .course-top {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4ff;
            font-size: 55px;
        }

        .course-body {
            padding: 22px;
        }

        .course-body h3 {
            font-size: 21px;
            margin-bottom: 9px;
        }

        .course-body p {
            color: #667085;
            font-size: 14px;
            line-height: 1.55;
            min-height: 66px;
        }

        /* =========================
           ПРОГРЕСС
        ========================= */

        .progress-row {
            margin-top: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress-info span:last-child {
            font-weight: 700;
        }

        .progress {
            height: 9px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.3s;
        }

        /* =========================
           КНОПКА КУРСА
        ========================= */

        .course-btn {
            width: 100%;
            margin-top: 20px;
            height: 46px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .course-btn:hover {
            background: #1d4ed8;
        }

        .course-btn.completed {
            background: #16a34a;
        }

        /* =========================
           ПУСТО
        ========================= */

        .empty {
            grid-column: 1 / -1;
            background: white;
            border-radius: 16px;
            padding: 35px;
            color: #667085;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        /* =========================
           АДАПТИВНОСТЬ
        ========================= */

        @media (max-width: 900px) {

            .courses {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header {
                padding: 0 18px;
            }

            .brand-icon {
                display: none;
            }

            .main {
                padding: 24px 15px;
            }

            .courses {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .section-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     ШАПКА
========================= -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            S
        </div>

        STEM Trainer

    </div>

    <button
        class="logout-btn"
        onclick="logout()"
    >
        Выйти
    </button>

</header>


<!-- =========================
     ОСНОВНОЙ КОНТЕНТ
========================= -->

<main class="main">

    <section class="welcome">

        <div class="welcome-small">
            Личный кабинет
        </div>

        <h1 id="teacherName">
            Добро пожаловать
        </h1>

        <p>
            Здесь находятся назначенные вам учебные курсы.
            Изучайте материалы поэтапно и следите за своим прогрессом.
        </p>

    </section>


    <div class="section-header">

        <h2 class="section-title">
            Мои курсы
        </h2>

        <div
            class="course-count"
            id="courseCount"
        ></div>

    </div>


    <div
        id="coursesContainer"
        class="courses"
    ></div>

</main>


<script>

/* ==========================================
   ПРОВЕРКА АВТОРИЗАЦИИ
========================================== */

const currentUser = JSON.parse(
    localStorage.getItem("stemCurrentUser")
);


if (
    !currentUser ||
    currentUser.role !== "teacher"
) {

    window.location.href = "index.html";

}


/* ==========================================
   ПОЛУЧАЕМ СПИСОК УЧИТЕЛЕЙ
========================================== */

const teachers = JSON.parse(
    localStorage.getItem("stemTeachers")
) || [];


/* ==========================================
   НАХОДИМ ТЕКУЩЕГО УЧИТЕЛЯ
========================================== */

const teacher = teachers.find(
    function(item) {

        return item.id === currentUser.id;

    }
);


/* ==========================================
   ЕСЛИ УЧИТЕЛЬ НЕ НАЙДЕН
========================================== */

if (!teacher) {

    localStorage.removeItem(
        "stemCurrentUser"
    );

    window.location.href =
        "index.html";

}


/* ==========================================
   ИМЯ УЧИТЕЛЯ
========================================== */

document.getElementById(
    "teacherName"
).textContent =
    "Здравствуйте, " + teacher.fullName;


/* ==========================================
   ИНФОРМАЦИЯ О КУРСАХ
========================================== */

const courseInfo = {

    "Arduino": {

        icon: "⚙️",

        description:
            "Основы работы с Arduino, подключение компонентов и создание первых проектов."

    },


    "Roket": {

        icon: "🚀",

        description:
            "Обучение работе с оборудованием и образовательными решениями Roket."

    },


    "Labdisc": {

        icon: "🔬",

        description:
            "Полный курс по цифровой лаборатории Labdisc: датчики, GlobiLab X, измерения и STEM-эксперименты."

    },


    "3D-принтер": {

        icon: "🧊",

        description:
            "Основы 3D-печати, подготовка моделей и работа с 3D-принтером."

    },


    "Лазерный принтер": {

        icon: "✨",

        description:
            "Работа с лазерным оборудованием, подготовка файлов и основы безопасности."

    }

};


/* ==========================================
   ПОЛУЧЕНИЕ ПРОГРЕССА
========================================== */

function getCourseProgress(courseName) {

    /*
       Для Labdisc используем отдельный
       прогресс из labdisc.html
    */

    if (courseName === "Labdisc") {

        const labdiscCompleted =
            JSON.parse(
                localStorage.getItem(
                    "labdiscCompleted"
                )
            ) || [];


        /*
           В нашем полном курсе Labdisc
           сейчас 10 уроков.
        */

        const totalLabdiscLessons = 10;


        return Math.round(
            labdiscCompleted.length /
            totalLabdiscLessons *
            100
        );

    }


    /*
       Для остальных курсов пока используется
       старая система прогресса
    */

    if (
        teacher.courseProgress &&
        teacher.courseProgress[courseName]
    ) {

        return teacher.courseProgress[
            courseName
        ];

    }


    return 0;

}


/* ==========================================
   ОТРИСОВКА КУРСОВ
========================================== */

function renderCourses() {

    const container =
        document.getElementById(
            "coursesContainer"
        );


    const count =
        teacher.courses
            ? teacher.courses.length
            : 0;


    document.getElementById(
        "courseCount"
    ).textContent =
        "Назначено курсов: " + count;


    if (
        !teacher.courses ||
        teacher.courses.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Администратор пока
                не назначил вам курсы.

            </div>

        `;

        return;

    }


    let html = "";


    teacher.courses.forEach(
        function(courseName) {


            const info =
                courseInfo[courseName] || {

                    icon: "📘",

                    description:
                        "Учебный курс STEM Trainer."

                };


            const progress =
                getCourseProgress(
                    courseName
                );


            let buttonText =
                "Начать курс";


            if (
                progress > 0 &&
                progress < 100
            ) {

                buttonText =
                    "Продолжить обучение";

            }


            if (progress >= 100) {

                buttonText =
                    "Открыть курс";

            }


            const completedClass =
                progress >= 100
                    ? "completed"
                    : "";


            html += `

                <div class="course-card">


                    <div class="course-top">

                        ${info.icon}

                    </div>


                    <div class="course-body">


                        <h3>
                            ${courseName}
                        </h3>


                        <p>
                            ${info.description}
                        </p>


                        <div class="progress-row">


                            <div class="progress-info">

                                <span>
                                    Прогресс
                                </span>

                                <span>
                                    ${progress}%
                                </span>

                            </div>


                            <div class="progress">

                                <div
                                    class="progress-bar"
                                    style="
                                        width:${progress}%
                                    "
                                ></div>

                            </div>


                        </div>


                        <button
                            class="
                                course-btn
                                ${completedClass}
                            "
                            onclick="
                                openCourse(
                                    '${courseName}'
                                )
                            "
                        >

                            ${buttonText}

                        </button>


                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* ==========================================
   ОТКРЫТИЕ КУРСА
========================================== */

function openCourse(courseName) {

    /*
       Сохраняем название выбранного курса
    */

    localStorage.setItem(
        "stemSelectedCourse",
        courseName
    );


    /*
       LABDISC ИМЕЕТ СВОЮ
       ОТДЕЛЬНУЮ СТРАНИЦУ
    */

    if (courseName === "Labdisc") {

        window.location.href =
            "./labdisc.html";

        return;

    }


    /*
       Остальные курсы пока открываются
       через общий course.html
    */

    window.location.href =
        "./course.html";

}


/* ==========================================
   ВЫХОД
========================================== */

function logout() {

    localStorage.removeItem(
        "stemCurrentUser"
    );


    window.location.href =
        "./index.html";

}


/* ==========================================
   ЗАПУСК
========================================== */

renderCourses();

</script>

</body>
</html>
