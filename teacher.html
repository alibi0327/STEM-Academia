<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Academia — Кабинет учителя</title><link rel="stylesheet" href="css/app.css"></head>
<body>
<header class="topbar">
 <div class="brand"><div class="brand-mark">S</div> STEM <span>ACADEMIA</span></div>
 <div class="userbox"><span id="teacherName"></span><button id="logout" class="btn secondary">Выйти</button></div>
</header>
<main class="main" style="max-width:1150px;margin:auto">
 <div class="page-head"><div><h1>Моё обучение</h1><div id="schoolName" class="muted"></div></div></div>
 <div id="welcome" class="notice">Загрузка данных...</div>
 <div id="courses" class="course-grid" style="margin-top:20px"></div>
 <section id="optionalSection" style="margin-top:38px">
  <div class="page-head"><div><h1>Дополнительные курсы</h1><div class="muted">Необязательное обучение. Выберите курс, который хотите пройти дополнительно.</div></div></div>
  <div id="optionalCourses" class="course-grid"><div class="notice">Загрузка дополнительных курсов...</div></div>
 </section>
 <div id="certificatesBlock" style="margin-top:38px"></div>
</main>
<script type="module" src="js/teacher.js"></script>
</body></html>
