<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STEM Trainer — Кабинет учителя</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            height: 74px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 22px;
            font-weight: 700;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            border-radius: 10px;

            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-size: 14px;
            color: #667085;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .main {
            max-width: 1180px;
            margin: 0 auto;

            padding: 36px 20px 60px;
        }

        .welcome {
            background: white;

            padding: 30px;

            border-radius: 18px;
            border: 1px solid #e5e7eb;

            margin-bottom: 30px;
        }

        .welcome-small {
            color: #2563eb;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #667085;
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 16px;

            margin-top: 25px;
        }

        .stat {
            background: #f8fafc;

            border-radius: 12px;

            padding: 16px;
        }

        .stat-label {
            font-size: 12px;
            color: #667085;

            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .section-title {
            font-size: 24px;
        }

        .course-count {
            color: #667085;
            font-size: 14px;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .course-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            overflow: hidden;

            transition: 0.2s;
        }

        .course-card:hover {
            transform: translateY(-3px);

            box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
        }

        .course-top {
            height: 150px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef4ff;

            font-size: 55px;
        }

        .course-body {
            padding: 22px;
        }

        .course-body h3 {
            font-size: 21px;
            margin-bottom: 9px;
        }

        .course-description {
            color: #667085;

            font-size: 14px;
            line-height: 1.55;

            min-height: 65px;
        }

        .progress-row {
            margin-top: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .progress-info strong {
            color: #172033;
        }

        .progress {
            height: 9px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            background: #22c55e;

            transition: width 0.3s;
        }

        .test-result {
            margin-top: 16px;

            padding: 11px 13px;

            border-radius: 10px;

            font-size: 13px;
        }

        .test-result.pass {
            background: #ecfdf3;
            color: #166534;
        }

        .test-result.fail {
            background: #fef2f2;
            color: #991b1b;
        }

        .course-btn {
            width: 100%;

            margin-top: 18px;

            height: 46px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .course-btn:hover {
            background: #1d4ed8;
        }

        .course-btn.completed {
            background: #16a34a;
        }

        .empty {
            grid-column: 1 / -1;

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 40px;

            text-align: center;

            color: #667085;
        }

        @media(max-width: 900px) {

            .courses {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 650px) {

            .header {
                padding: 0 15px;
            }

            .brand-icon,
            .user-name {
                display: none;
            }

            .courses {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 24px;
            }

        }

    </style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            S
        </div>

        STEM Trainer

    </div>


    <div class="user-block">

        <div
            class="user-name"
            id="headerTeacherName"
        ></div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Выйти
        </button>

    </div>

</header>


<main class="main">

    <section class="welcome">

        <div class="welcome-small">
            Личный кабинет преподавателя
        </div>

        <h1 id="teacherName">
            Здравствуйте
        </h1>

        <p>
            Здесь находятся только те курсы,
            которые назначил вам администратор.
            Ваш прогресс, уроки и результаты
            тестирования сохраняются индивидуально.
        </p>


        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    Назначено курсов
                </div>

                <div
                    class="stat-value"
                    id="assignedCount"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Курсов начато
                </div>

                <div
                    class="stat-value"
                    id="startedCount"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Курсов завершено
                </div>

                <div
                    class="stat-value"
                    id="completedCount"
                >
                    0
                </div>

            </div>

        </div>

    </section>


    <div class="section-header">

        <h2 class="section-title">
            Мои курсы
        </h2>

        <div
            class="course-count"
            id="courseCount"
        ></div>

    </div>


    <div
        class="courses"
        id="coursesContainer"
    ></div>

</main>


<script>

/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

const currentUser =
    JSON.parse(
        localStorage.getItem(
            "stemCurrentUser"
        )
    );


if (
    !currentUser ||
    currentUser.role !== "teacher"
) {

    window.location.href =
        "index.html";

}


/* =====================================================
   СПИСОК УЧИТЕЛЕЙ
===================================================== */

const teachers =
    JSON.parse(
        localStorage.getItem(
            "stemTeachers"
        )
    ) || [];


/* =====================================================
   ТЕКУЩИЙ УЧИТЕЛЬ
===================================================== */

const teacher =
    teachers.find(
        function(item) {

            return (
                String(item.id) ===
                String(currentUser.id)
            );

        }
    );


if (!teacher) {

    localStorage.removeItem(
        "stemCurrentUser"
    );

    window.location.href =
        "index.html";

}


/* =====================================================
   ФИО
===================================================== */

document.getElementById(
    "teacherName"
).textContent =
    "Здравствуйте, " +
    teacher.fullName;


document.getElementById(
    "headerTeacherName"
).textContent =
    teacher.fullName;


/* =====================================================
   ИНФОРМАЦИЯ О КУРСАХ
===================================================== */

const courseInfo = {

    "Arduino": {

        icon: "⚙️",

        description:
            "Основы работы с Arduino, электронными компонентами, датчиками и созданием проектов."

    },

    "Roket": {

        icon: "🚀",

        description:
            "Обучение работе с образовательным оборудованием и решениями Roket."

    },

    "Labdisc": {

        icon: "🔬",

        description:
            "Цифровая лаборатория Labdisc: датчики, GlobiLab X, измерения, эксперименты и анализ данных."

    },

    "3D-принтер": {

        icon: "🧊",

        description:
            "Основы 3D-печати, подготовка цифровых моделей и работа с 3D-принтером."

    },

    "Лазерный принтер": {

        icon: "✨",

        description:
            "Подготовка макетов и обучение работе с лазерным оборудованием."

    }

};


/* =====================================================
   ПРОГРЕСС LABDISC КОНКРЕТНОГО УЧИТЕЛЯ
===================================================== */

function getLabdiscProgress() {

    const progressKey =
        "labdiscCompleted_" +
        teacher.id;


    const completed =
        JSON.parse(
            localStorage.getItem(
                progressKey
            )
        ) || [];


    const totalLessons =
        10;


    return Math.round(
        completed.length /
        totalLessons *
        100
    );

}


/* =====================================================
   ПРОГРЕСС КУРСА
===================================================== */

function getCourseProgress(
    courseName
) {

    if (
        courseName ===
        "Labdisc"
    ) {

        return getLabdiscProgress();

    }


    if (
        teacher.courseProgress &&
        typeof teacher
            .courseProgress[
                courseName
            ] === "number"
    ) {

        return teacher
            .courseProgress[
                courseName
            ];

    }


    return 0;

}


/* =====================================================
   ТЕСТ
===================================================== */

function getTestResult(
    courseName
) {

    if (
        !teacher.testResults
    ) {

        return null;

    }


    return (
        teacher.testResults[
            courseName
        ] || null
    );

}


/* =====================================================
   КАРТОЧКИ КУРСОВ
===================================================== */

function renderCourses() {

    const container =
        document.getElementById(
            "coursesContainer"
        );


    const assignedCourses =
        teacher.courses || [];


    document.getElementById(
        "courseCount"
    ).textContent =
        "Назначено: " +
        assignedCourses.length;


    document.getElementById(
        "assignedCount"
    ).textContent =
        assignedCourses.length;


    let started =
        0;


    let finished =
        0;


    assignedCourses.forEach(
        function(courseName) {

            const progress =
                getCourseProgress(
                    courseName
                );


            if (progress > 0) {
                started++;
            }


            if (progress >= 100) {
                finished++;
            }

        }
    );


    document.getElementById(
        "startedCount"
    ).textContent =
        started;


    document.getElementById(
        "completedCount"
    ).textContent =
        finished;


    if (
        assignedCourses.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    Курсы пока не назначены
                </h3>

                <p style="
                    margin-top:8px;
                ">
                    Обратитесь к администратору
                    STEM Trainer.
                </p>

            </div>

        `;

        return;

    }


    let html =
        "";


    assignedCourses.forEach(
        function(courseName) {


            const info =
                courseInfo[
                    courseName
                ] || {

                    icon: "📘",

                    description:
                        "Учебный курс STEM Trainer."

                };


            const progress =
                getCourseProgress(
                    courseName
                );


            const test =
                getTestResult(
                    courseName
                );


            let buttonText =
                "Начать курс";


            if (
                progress > 0 &&
                progress < 100
            ) {

                buttonText =
                    "Продолжить обучение";

            }


            if (
                progress >= 100
            ) {

                buttonText =
                    "Открыть курс";

            }


            let testHtml =
                "";


            if (test) {

                testHtml = `

                    <div class="
                        test-result
                        ${
                            test.passed
                                ? "pass"
                                : "fail"
                        }
                    ">

                        ${
                            test.passed
                                ? "✓ Тест сдан"
                                : "Тест не сдан"
                        }

                        — ${test.percent}%

                    </div>

                `;

            }


            html += `

                <article class="course-card">

                    <div class="course-top">

                        ${info.icon}

                    </div>


                    <div class="course-body">

                        <h3>
                            ${courseName}
                        </h3>

                        <div class="course-description">

                            ${info.description}

                        </div>


                        <div class="progress-row">

                            <div class="progress-info">

                                <span>
                                    Прогресс
                                </span>

                                <strong>
                                    ${progress}%
                                </strong>

                            </div>


                            <div class="progress">

                                <div
                                    class="progress-bar"
                                    style="
                                        width:
                                        ${progress}%;
                                    "
                                ></div>

                            </div>

                        </div>


                        ${testHtml}


                        <button
                            class="
                                course-btn
                                ${
                                    progress >= 100
                                        ? "completed"
                                        : ""
                                }
                            "
                            onclick="
                                openCourse(
                                    '${courseName}'
                                )
                            "
                        >

                            ${buttonText}

                        </button>

                    </div>

                </article>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   ОТКРЫТИЕ ТОЛЬКО НАЗНАЧЕННОГО КУРСА
===================================================== */

function openCourse(
    courseName
) {

    /*
        Дополнительная защита:
        проверяем, что этот курс
        действительно назначен учителю.
    */

    if (
        !teacher.courses ||
        !teacher.courses.includes(
            courseName
        )
    ) {

        alert(
            "У вас нет доступа к этому курсу."
        );

        return;

    }


    localStorage.setItem(
        "stemSelectedCourse",
        courseName
    );


    if (
        courseName ===
        "Labdisc"
    ) {

        window.location.href =
            "labdisc.html";

        return;

    }


    window.location.href =
        "course.html";

}


/* =====================================================
   ВЫХОД
===================================================== */

function logout() {

    localStorage.removeItem(
        "stemCurrentUser"
    );


    localStorage.removeItem(
        "stemSelectedCourse"
    );


    window.location.href =
        "index.html";

}


/* =====================================================
   ЗАПУСК
===================================================== */

renderCourses();

</script>

</body>
</html>
